; Токен бота, полученный через BotFather.
TELEGRAM_BOT_TOKEN = ""

; ID разрешённого пользователя.
; Узнать через: php bin/bot.php identify
TELEGRAM_ALLOWED_USER_ID = ""

; local — модель на вашем компьютере или в локальной сети; cloud — облачный сервис.
AI_PROVIDER_LOCATION = "local"
; Адрес OpenAI-совместимого API без /chat/completions:
; для local — адрес вашего сервера, для cloud — HTTPS-адрес выбранного сервиса.
AI_BASE_URL = "http://127.0.0.1:1234/v1"
; Идентификатор модели: из локального сервера или документации облачного сервиса.
AI_MODEL = ""
; Ключ для local необязателен, если сервер его не требует; для cloud обязателен.
AI_API_KEY = ""
; При запросе в режиме cloud текст вакансии, профиль и инструкции отправляются
; выбранному сервису. Дополнительного флага подтверждения нет.
; Всего попыток каждого этапа, включая первую; допустимо 1–5.
AI_MAX_ATTEMPTS = "3"
; Максимальное время ожидания одного запроса к ИИ, в секундах (30–1800). По умолчанию 180.
; Для медленной локальной модели можно временно поставить 300 или 600 и перезапустить бота.
AI_REQUEST_TIMEOUT_SECONDS = "180"

; Необязательные частные правила: по умолчанию списки пусты, всё передаётся ИИ.
; Только буквальный текст UTF-8, не регулярные выражения. Повторяйте ключи с [].
; Отказ возможен лишь при совпадении ВСЕГО однострочного сообщения, с учётом регистра.
; AI_PREFILTER_EXACT_REJECT_LINES[] = "Только ночная смена."
; Термин неоднозначности отменяет даже точное совпадение (без учёта регистра).
; AI_PREFILTER_AMBIGUITY_TERMS[] = "обсуждается"
