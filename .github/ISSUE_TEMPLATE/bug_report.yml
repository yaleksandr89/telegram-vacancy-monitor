name: Сообщение об ошибке
description: Ошибка приложения или документации без секретов и личных данных.
body:
  - type: markdown
    attributes:
      value: "Об уязвимостях сообщайте по [политике безопасности](https://github.com/yaleksandr89/telegram-vacancy-monitor/security/policy). Используйте только искусственные данные."
  - type: dropdown
    id: category
    attributes:
      label: Область ошибки
      options:
        - Локальный запуск / интерфейс Linux
        - Локальный запуск / интерфейс Windows
        - Локальный запуск / интерфейс macOS
        - Webhook / CLI-воркер
        - Обработка ИИ
        - Документация
        - Другое / неизвестно
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Ожидаемый и фактический результат
      description: Что должно было произойти и что произошло?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Шаги воспроизведения
      description: Используйте искусственные вакансии и профили, без приватных файлов.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Среда и версия
      description: ОС, способ запуска, версия PHP, версия приложения или commit. Неизвестные значения можно так и обозначить.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Обезличенные логи (необязательно)
      description: Удалите токены, ключи, ID, личные пути и тексты частных сообщений.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Безопасность данных
      options:
        - label: Сообщение и вложения не содержат секретов и персональных данных.
          required: true
