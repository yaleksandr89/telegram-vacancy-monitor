name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP 8.5 / Checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: curl, mbstring, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check quality and smoke tests
        run: composer check

      - name: Check standalone build boundaries
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 tests/portable/build_smoke.py
          python3 tests/portable/release_pipeline_smoke.py

  php-compatibility:
    name: PHP 8.6 / Runtime compatibility
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.6'
          extensions: curl, mbstring, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Install runtime dependencies only
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --no-scripts --no-plugins

      - name: Verify runtime platform requirements
        run: composer check-platform-reqs --no-dev

      - name: Check PHP syntax
        run: composer lint

      - name: Run smoke tests
        run: composer test
